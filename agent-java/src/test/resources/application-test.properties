# Test Configuration
# Disable strict security for tests

# CORS - allow all for tests
cors.allowed-origins=*
cors.allow-credentials=false

# Disable strict mode and API key for tests
security.strict-mode=false
security.api-key.enabled=false
security.hsts.enabled=false
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=1000

# AEM disabled for tests
aem.enabled=false

# Embabel LLM providers - use Ollama (local) as default, provide dummy keys for others
embabel.models.default-llm=gpt-4o-mini
embabel.agent.platform.models.anthropic.api-key=test-dummy-key
embabel.mcp.server.enabled=false

# Disable AI-dependent features in tests
aem.agent.ai.enabled=false
