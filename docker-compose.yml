version: "3.8"

services:
  java-agent:
    build:
      context: ./agent-java
      dockerfile: Dockerfile
    ports:
      - "10003:10003"
    environment:
      - AI_ENABLED=false
      - AEM_ENABLED=false
      - SECURITY_API_KEY_ENABLED=true
      - SECURITY_API_KEY=change-me-in-production
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10003/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      java-agent:
        condition: service_healthy
    environment:
      - VITE_JAVA_AGENT_URL=http://java-agent:10003
